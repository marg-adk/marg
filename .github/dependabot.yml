# Dependabot: weekly, grouped, so updates arrive as a few reviewable PRs rather than dozens.
# Every PR runs the full gate; a green gate is the only evidence an update is safe.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Deps"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"
