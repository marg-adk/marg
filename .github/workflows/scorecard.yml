# OpenSSF Scorecard: the supply-chain health checks every well-run open-source repository is
# measured by (branch protection, pinned deps, token permissions, CI tests, SAST, …). Results go
# to Security → Code scanning and the badge in the README.
name: scorecard
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 2"
  branch_protection_rule:
permissions: read-all
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
