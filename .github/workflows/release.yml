# Release: a tag v<version> runs the gate, builds, and publishes every package to npm by trusted
# publishing (OIDC): no token, provenance generated by npm. Each package names this workflow file
# as a trusted publisher on npmjs.com (Settings → Trusted publishing → GitHub Actions: marg-adk /
# marg / release.yml, with "npm publish" allowed). A package's FIRST version is published by
# hand with 2FA, since the setting lives on an existing package. RELEASING.md has the flow.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm ≥ 11.5.1; Node 22 ships npm 10
      - run: npm install -g npm@11 && npm --version
      - run: npm ci --no-audit --no-fund
      - name: The tag must match the package version
        run: |
          v=$(node -p "require('./package.json').version")
          [[ "${GITHUB_REF_NAME}" == "v$v" ]] || { echo "tag ${GITHUB_REF_NAME} != package version v$v"; exit 1; }
          for p in packages/*/package.json; do
            pv=$(node -p "require('./$p').version"); [[ "$pv" == "$v" ]] || { echo "$p is $pv, expected $v"; exit 1; }
          done
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:otel
      - run: npm run check:scaffold
      - run: npm run check:e2e
      - name: Example suite on the mock model (writes off)
        run: |
          cp .env.example .env
          npm run gateway:evals > gateway.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:8788/api/health > /dev/null 2>&1 && break; sleep 1; done
          npm run evals
          npm run evals:bookings
      - run: npm run check:pack
      - run: npm run check:create
      - name: No token in the npm config — OIDC only
        # setup-node writes an _authToken placeholder into the runner's npmrc; with trusted publishing
        # there is no token, and a placeholder can shadow the OIDC exchange. Keep only the registry.
        run: |
          echo "registry=https://registry.npmjs.org/" > "$NPM_CONFIG_USERCONFIG"
          echo "npm $(npm --version) · registry $(npm config get registry) · OIDC available: $([ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && echo yes || echo no)"
          echo "workflow ref: ${GITHUB_WORKFLOW_REF}"
      - name: Publish (dependency order, OIDC — provenance is automatic)
        run: |
          # from each package's own directory: the OIDC exchange is made for the package being published
          for d in types core verdict evals metering widget gateway marg create-marg-app; do
            (cd "packages/$d" && echo "▶ $(node -p "require('./package.json').name")" && npm publish --access public)
          done
