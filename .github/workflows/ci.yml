# The gate every change runs: types, unit tests, and the example domain end to end on the
# scripted mock model (writes off, no key, no network). docs/guides/evals.md explains the report.
# A second job proves the packages still build, pack and install into a fresh create-marg-app project.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:otel
      - run: npm run check:scaffold
      - run: npm run check:e2e
      - name: Example suite on the mock model (writes off)
        run: |
          cp .env.example .env
          npm run gateway:evals > gateway.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8788/health > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8788/health
          npm run evals
      - name: Gateway log (on failure)
        if: failure()
        run: tail -n 200 gateway.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: eval-results
          path: examples/support-intake/evals/results/
          if-no-files-found: ignore
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:pack
      - run: npm run check:create
