# The gate every change runs: lint, types, unit tests, and the example domain end to end on the
# scripted mock model (writes off, no key, no network) — on Node 22 and 24. docs/guides/evals.md
# explains the report. A second job proves the packages still build, pack and install into a
# fresh create-marg-app project. A third builds the deploy image and probes its health, so a
# file missing from the image fails here and not on the host. A fourth scaffolds a domain with the
# Python tool server on Python 3.11 and runs the same check. Branch protection requires all four.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    name: gate (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: No generated files are tracked
        run: |
          bad=$(git ls-files | grep -E '^(website/src|website/\.vitepress/(dist|cache)|packages/[^/]+/(dist|payload)|packages/[^/]+/LICENSE)(/|$)' || true)
          if [ -n "$bad" ]; then echo "generated files are tracked — remove them from the index:"; echo "$bad" | head -20; exit 1; fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:otel
      - run: npm run check:scaffold
      - run: npm run check:e2e
      - name: Example suite on the mock model (writes off)
        run: |
          cp .env.example .env
          npm run gateway:evals > gateway.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8788/api/health > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8788/api/health
          npm run evals
          npm run evals:bookings
      - name: Gateway log (on failure)
        if: failure()
        run: tail -n 200 gateway.log || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: eval-results-node${{ matrix.node }}
          path: examples/*/evals/results/
          if-no-files-found: ignore
  scaffold-python:
    name: scaffold (python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: npm ci --no-audit --no-fund
      - name: The scaffold check with the Python tool server
        run: SCAFFOLD_LANG=python npm run check:scaffold
      - name: Gateway log (on failure)
        if: failure()
        run: tail -n 100 .data/gw-scaffold.log || true
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:pack
      - run: npm run check:create
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the gateway image
        run: docker build -f deploy/Dockerfile -t marg-gateway:ci .
      - name: Boot it on the mock model (writes off) and probe health and the playground
        run: |
          docker run -d --name gw -p 8787:8787 -e LLM_CHAIN=mock -e AGENT_ALLOW_WRITES=false -e AGENT_REQUIRE_LOGIN=false marg-gateway:ci
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8787/api/health > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8787/api/health
          curl -fsS http://localhost:8787/ | grep -q widget.js
          bytes=$(curl -fsS http://localhost:8787/widget.js | wc -c)
          [ "$bytes" -gt 10000 ]
          echo "image OK: health, playground and widget served"
      - name: Container log (on failure)
        if: failure()
        run: docker logs gw 2>&1 | tail -n 100 || true
