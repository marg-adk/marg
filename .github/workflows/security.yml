# Security gate on every PR and weekly: dependency review (new vulnerable or copyleft
# dependencies fail the PR) and npm audit at high. Secrets are caught by GitHub secret scanning
# with push protection, enabled on the repository (no action to run, nothing to license).
name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
permissions:
  contents: read
jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0, SSPL-1.0
          comment-summary-in-pr: on-failure
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: npm audit (high and above)
        run: npm audit --audit-level=high
