# deploy/docker-compose.yml — the gateway plus optional profiles.
#
#   cp .env.production.example .env.production      # fill it (docs/ENVIRONMENT.md)
#   docker compose -f deploy/docker-compose.yml --env-file .env.production up -d
#
#   --profile stores         Redis + Mongo for sessions, ledgers and counters (ADR-0002)
#   --profile observability  OpenObserve for traces, metrics and logs (ADR-0003)
#   --profile decisions      Ollama serving `laya` for Verdict's System One backend (ADR-0005)
#   --profile edge           Caddy with automatic TLS in front of the gateway
#
# Inside this network the gateway reaches redis://redis:6379, mongodb://mongo:27017,
# http://openobserve:5080 and http://ollama:11434 — .env.production.example uses those names.
services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: marg-gateway:local
    env_file:
      - ../.env.production
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - gateway-data:/app/.data
    restart: unless-stopped
    stop_grace_period: 40s

  redis:
    profiles: ["stores"]
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  mongo:
    profiles: ["stores"]
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  openobserve:
    profiles: ["observability"]
    image: public.ecr.aws/zinclabs/openobserve:latest
    environment:
      ZO_ROOT_USER_EMAIL: ${O2_ROOT_USER_EMAIL:?set O2_ROOT_USER_EMAIL in .env.production}
      ZO_ROOT_USER_PASSWORD: ${O2_ROOT_USER_PASSWORD:?set O2_ROOT_USER_PASSWORD in .env.production}
      ZO_DATA_DIR: /data
      ZO_TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:5080:5080"
    volumes:
      - o2-data:/data
    restart: unless-stopped

  ollama:
    profiles: ["decisions"]
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped

  ollama-pull:
    profiles: ["decisions"]
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 3 && ollama pull ${LAYA_MODEL:-laya}"]
    restart: "no"

  caddy:
    profiles: ["edge"]
    image: caddy:2-alpine
    environment:
      AGENT_DOMAIN: ${AGENT_DOMAIN:?set AGENT_DOMAIN (public hostname) in .env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  gateway-data:
  redis-data:
  mongo-data:
  o2-data:
  ollama-models:
  caddy-data:
  caddy-config:
